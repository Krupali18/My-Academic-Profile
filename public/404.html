    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;

      color: var(--nf-ink);

    .art { width: min(230px, 62vw); height: auto; margin-bottom: 8px; }

    .code {

      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;

    .heading {

      margin-top: 4px;

      line-height: 1.6;
      font-size: 16px;
      color: var(--nf-muted);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 999px;
      background: var(--nf-accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 46, 93, 0.15);
    }
    .btn:hover {
      background: var(--nf-accent-hover);
      transform: translateY(-1px);
    }
    .link {
      display: block;
      margin-top: 18px;
      font-size: 14px;
      color: var(--nf-accent);
      text-underline-offset: 3px;
      text-decoration: underline;
    }
    .btn:focus-visible, .link:focus-visible {
      outline: 3px solid var(--nf-accent);
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: no-preference) {
      .doc {
        animation: float 3.5s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
    }
