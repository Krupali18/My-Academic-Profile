# Lighthouse CI Configuration (MD File 13)
# Automatic Core Web Vitals & Quality Gate Validation
ci:
  collect:
    url:
      - http://localhost:3000/
      - http://localhost:3000/about
      - http://localhost:3000/publications
    numberOfRuns: 3
    settings:
      preset: desktop
  assert:
    preset: lighthouse:recommended
    assertions:
      categories:performance:
        - error
        - minScore: 0.90
      categories:accessibility:
        - error
        - minScore: 0.95
      categories:best-practices:
        - error
        - minScore: 0.95
      categories:seo:
        - error
        - minScore: 0.95
      # Core Web Vitals specific assertions
      first-contentful-paint:
        - error
        - maxNumericValue: 1800
      largest-contentful-paint:
        - error
        - maxNumericValue: 2500
      cumulative-layout-shift:
        - error
        - maxNumericValue: 0.1
  upload:
    target: temporary-public-storage
